# Restrictions that apply everywhere; shown on every property.
general_restrictions:
  - text: "Map boundaries are approximate. GRANIT marks this data 'not for legal use'; look for posted boundary lines on the ground."
    sources: [granit_standard]
  - text: "No firearm discharge in 'compact zones' (six or more homes each within 300 ft of another, plus a 300 ft buffer). Check local ordinances."
    sources: [nhfg_state_lands_faq]

rules:
  - id: clhw-easement
    status: verified
    when:
      parent_name_contains: "Connecticut Lakes Headwaters"
    summary: "Hunting is permitted with restrictions on the Connecticut Lakes Headwaters forest, per the state's posted forest rules."
    restrictions:
      - "Follow Res 7301.10. No firearm discharge within 300 ft of developed recreation areas when occupied."
      - "No camping and no fires on the property."
      - "ATVs, trail bikes and snowmobiles only on trails designated by the Bureau of Trails."
      - "Land is privately owned under a state conservation easement; logging traffic and road conditions change. Respect gates and closures."
      - "Roads: the state's draft road plan says the road system is open to registered, inspected road vehicles from about mid-May until about Dec 15, with some roads gated; most gates are open during moose season. Never drive around a closed gate."
    sources: [clhw_rules_sign, res_7301_10, clhw_road_plan]

  - id: nhfg-connecticut-lakes-natural-area
    status: verified
    when:
      agency_code: [32000]
      name_contains: "Connecticut Lakes Natural Area"
    summary: "Fish and Game land open to hunting under Fis 902.02. Rule Fis 903.07 adds limits specific to the Connecticut Lakes Natural Area."
    restrictions:
      - "No hunting over bait."
      - "No camping."
      - "No motorized vehicles except snowmobiles and wheeled vehicles on designated roads and trails."
      - "Portable stands only, Aug 1 - Jan 31. No permanent stands or blinds."
    sources: [fis_903_07, fis_900]

  - id: dartmouth-second-college-grant
    status: verified
    when:
      name_contains: "Second College Grant"
    summary: "Dartmouth's hunting brochure says the Second College Grant is open to public hunting, except areas temporarily closed for logging, research or safety. Plan to walk in."
    restrictions:
      - "The public can't drive in at any time of year: vehicle passes are only for Dartmouth-affiliated visitors and their guests, and none are issued Oct 1 - Nov 28. Walk in from the gates; foot travel is welcome any time."
      - "Report deer and bear to the gatekeeper at the main gate off Route 16."
      - "No baiting. No road hunting. No shooting within 15 ft of open roads or marked trails or within 300 ft of a cabin."
      - "No ATVs or snowmobiles to haul out game. No camping or open fires."
    sources: [dartmouth_grant, dartmouth_grant_page]
    note: "The hunting rules come from a 2012 brochure; Dartmouth's current web page covers access but doesn't mention hunting. Call College Forester Kevin Evans (603-449-2049) to confirm before your trip."

  - id: dncr-state-historic-sites
    status: prohibited
    when:
      agency_code: [31000]
      name_contains: "Historic Site"
    summary: "Fish and Game's State Lands FAQ says hunting is not allowed at any DNCR state historic site."
    sources: [nhfg_state_lands_faq]

  - id: pondicherry-wildlife-refuge
    status: prohibited
    when:
      name_contains: "Pondicherry Wildlife Refuge"
    summary: "Fish and Game's State Lands FAQ lists the Pondicherry Wildlife Refuge in Jefferson as closed to hunting."
    sources: [nhfg_state_lands_faq]

  - id: conte-pondicherry-division
    status: unknown
    when:
      agency_code: [21000]
      name_contains: "Pondicherry"
    summary: "Pondicherry Division of the Silvio O. Conte refuge. The Fish and Wildlife Service says the division supports deer hunting but that not all parts of the refuge are open, and the closed areas weren't found. Fish and Game lists the Pondicherry Wildlife Refuge, inside this area, as closed."
    restrictions:
      - "Get the refuge's New Hampshire hunting information sheet or call the refuge for closed areas before hunting."
    sources: [conte_hunting, nhfg_state_lands_faq]

  - id: weeks-state-park
    status: unknown
    when:
      agency_code: [31000]
      name_contains: "Weeks State Park"
    summary: "Weeks State Park includes the John Wingate Weeks Historic Site, and Fish and Game says hunting isn't allowed at state historic sites. It's unclear how much of the park that covers; ask NH State Parks before hunting."
    sources: [weeks_park_page, nhfg_state_lands_faq]

  - id: granit-no-public-access
    status: prohibited
    when:
      public_access_code: [3]
    summary: "GRANIT records public access as not allowed. Treat as off-limits unless you have the landowner's permission."
    sources: [granit_standard]

  - id: dncr-fee-land
    status: verified
    when:
      agency_code: [31000]
      protection_type_code: [FO]
    name_excludes: ["Shieling", "Opechee", "Opeechee", "Urban Forestry", "Robert Frost", "Odiorne"]
    summary: "State park or forest owned by NH DNCR. Fish and Game's State Lands FAQ and rule Res 7301.10 name the few state properties closed to hunting; this isn't one of them."
    restrictions:
      - "No firearm discharge within 300 ft of occupied developed areas such as campgrounds, beaches and playgrounds."
      - "Portable tree stands only, Aug 1 - Jan 31, no nails or damage to trees. No permanent stands."
      - "Baiting only by Fish and Game permit."
    sources: [res_7301_10, nhfg_state_lands_faq]

  - id: usfs-wmnf
    status: verified
    when:
      agency_code: [22000]
      protection_type_code: [FO]
    summary: "White Mountain National Forest land. The Forest Service allows hunting on all WMNF land, including Wilderness, under state regulations."
    restrictions:
      - "No discharge within 150 yards of a residence, building, campsite, developed recreation site or occupied area."
      - "No shooting across or on a Forest Service road or an adjacent body of water, or into a cave."
      - "Private inholdings inside the forest need landowner permission."
    sources: [wmnf_hunting]

  - id: usfws-umbagog
    status: verified
    when:
      agency_code: [21000]
      name_contains: "Umbagog"
    summary: "Lake Umbagog National Wildlife Refuge. Deer hunting is allowed under NH (or Maine) rules plus refuge rules; the stricter rule applies."
    restrictions:
      - "Temporary stands and blinds only: up no earlier than 14 days before the season, down within 14 days after, marked with your license number."
      - "No baiting. No ATVs or UTVs. Vehicles allowed on logging roads, not skid roads or skidder trails."
    sources: [umbagog_hunting]

  - id: nhfg-listed-lands
    status: verified
    when:
      agency_code: [32000]
      name_any: ["Brown WMA", "Gray WMA", "Greenough Pond", "Mount Kelsey", "Muise Mountain", "Long Mountain", "Horne Brook", "Upper Ammonoosuc", "Hedgehog Brook", "Bofinger", "Connecticut River Shorebank"]
    summary: "Listed in Fish and Game's Table 900.01, which Fis 902.02 opens to public hunting during open seasons."
    restrictions:
      - "Portable stands only, Aug 1 - Jan 31. No permanent stands or blinds."
      - "No ATVs or snowmobiles except on approved trails and frozen public waters."
      - "Camping and overnight stays need a Fish and Game permit."
    sources: [fis_900]

  - id: nhfg-land
    status: unknown
    when:
      agency_code: [32000]
    summary: "Owned or protected by NH Fish and Game. Fish and Game says most of its land is open, but rules vary by property. Confirm before hunting."
    sources: [nhfg_where_to_hunt]

  - id: other-federal
    status: unknown
    when:
      agency_code: [20000, 21000, 21100, 21200, 22100, 23000]
    summary: "Federal land without a property-specific hunting source yet. Check the managing agency's rules."
    sources: [granit_standard]

  - id: restricted-public-access
    status: unknown
    when:
      public_access_code: [2]
    summary: "GRANIT says public access is restricted to certain areas, times or members. Hunting permission not confirmed."
    sources: [granit_standard]

default:
  status: unknown
  summary: "No official source checked yet confirms hunting is allowed here. Treat as a research candidate."
  sources: [granit_standard]
