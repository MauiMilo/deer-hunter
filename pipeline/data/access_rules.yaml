# Hunting-permission rules.
#
# A property is labeled "verified" ONLY when a rule below, backed by a cited official source,
# matches it. Everything else stays "unknown" (a research candidate) or "prohibited".
#
# Order matters: the first matching rule wins. Your own checks in verifications.yaml beat
# every rule here. Property-specific rules come first, then the GRANIT "no public access"
# flag, then agency-wide rules.
#
# Match keys (all listed keys must match):
#   agency_code: [list of GRANIT PPAGENCY codes]
#   protection_type_code: [list of GRANIT PPTYPE codes, e.g. FO = fee ownership]
#   public_access_code: [list of GRANIT ACCESS codes]
#   name_contains / parent_name_contains: case-insensitive text
#   name_any: list of case-insensitive text; matches if the name contains any of them
#   name_excludes: list of case-insensitive text; rule is skipped if the name contains any

