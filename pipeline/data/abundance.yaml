# Deer abundance: adult (antlered) buck kill per square mile of deer habitat, by Wildlife
# Management Unit. Fish and Game calls adult buck kill "New Hampshire's most consistent index of
# total deer population" and judges each unit on the 2-year average, so that's what is used here.
#
# From the 2025 New Hampshire Wildlife Harvest Summary (NH Fish and Game, published 2026-05-18):
#   adult_bucks_2024 / adult_bucks_2025  - "Adult (antlered) buck kill by WMU (1965-2025)", report p. 10
#   two_year_average                      - matches "Current level" in "Deer population objectives", p. 6
#   total_kill_2025 / total_kpsm_2025     - "Total kill by season and WMU during 2025", p. 9; Fish and
#                                           Game's kill per square mile there uses its estimate of
#                                           square miles of deer habitat in each unit
#   habitat_sq_mi                         - total_kill_2025 / total_kpsm_2025 (computed here; the 20
#                                           units add up to the report's statewide 7,949 sq mi within rounding)
#   buck_kill_per_sqmi                    - two_year_average / (total_kill_2025 / total_kpsm_2025)
# The report also gives total deer kill per square mile by town, but that counts antlerless deer
# too, so towns aren't used. A test (test_abundance.py) recomputes every value from the inputs.
#
# Coos holds this back until 2026-12-09 (Region.abundance_from in config.py).

year: 2025
period: "2024-2025 average"
source:
  title: "2025 New Hampshire Wildlife Harvest Summary"
  url: https://www.wildlife.nh.gov/hunting-nh/hunting-reports-harvest-summaries
  file: https://www.wildlife.nh.gov/sites/g/files/ehbemt746/files/documents/harvest-summary.pdf
  publisher: NH Fish and Game Department
  published: "2026-05-18"
  page: "report pp. 6, 9 and 10"
  retrieved: "2026-11-18"
