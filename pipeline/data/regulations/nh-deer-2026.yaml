legal_hours:
  rule: "Half an hour before sunrise to half an hour after sunset."
  before_sunrise_min: 30
  after_sunset_min: 30
  source: regulations

# Each season: method, units it applies to, inclusive date range, which deer may be taken.
seasons:
  - method: archery
    units: [A]
    start: "2026-09-15"
    end: "2026-12-08"
    deer: any
    note: "WMU A archery closes one week earlier than the rest of the state."
  - method: archery
    units: [B, C1, C2, D1, E]
    start: "2026-09-15"
    end: "2026-12-15"
    deer: any
  - method: youth
    units: [A, B, C1, C2, D1, E]
    start: "2026-10-24"
    end: "2026-10-25"
    deer: any
    note: "Youth hunters only, with a licensed adult."
  - method: muzzleloader
    units: [A, B, C1, C2, D1]
    start: "2026-10-31"
    end: "2026-11-10"
    deer: antlered
  - method: muzzleloader
    units: [E]
    start: "2026-10-31"
    end: "2026-10-31"
    deer: any
  - method: muzzleloader
    units: [E]
    start: "2026-11-01"
    end: "2026-11-10"
    deer: antlered
  - method: firearm
    units: [A]
    start: "2026-11-11"
    end: "2026-11-11"
    deer: any
  - method: firearm
    units: [A]
    start: "2026-11-12"
    end: "2026-11-29"
    deer: antlered
  - method: firearm
    units: [B, C1, C2, D1]
    start: "2026-11-11"
    end: "2026-11-11"
    deer: any
  - method: firearm
    units: [B, C1, C2, D1]
    start: "2026-11-12"
    end: "2026-12-06"
    deer: antlered
  - method: firearm
    units: [E]
    start: "2026-11-11"
    end: "2026-11-12"
    deer: any
  - method: firearm
    units: [E]
    start: "2026-11-13"
    end: "2026-12-06"
    deer: antlered

definitions:
  antlered: "A deer with at least one antler 3 inches or longer."
  any: "Any deer, regardless of sex or age."

method_notes:
  crossbow: "In the Coos units (A, B, C1, C2, D1, E), most archers may NOT use a crossbow in regular archery season; that's only allowed in D2W, G1, G2, H1, H2, I1, I2, J1, J2, K, L and M. Exceptions that apply everywhere: archery license holders 68 or older; Disabled Crossbow Permit holders (any bow season, crossbow only); youth hunters on Youth Deer Weekend; firearms license holders during firearms season (firearms tag); muzzleloader license holders during muzzleloader season (firearms tag)."
  bag: "Each regular, archery or combination license covers one deer. A Special Archery Deer Permit adds one antlered deer."
  registration: "Register within 24 hours. Online registration is unavailable the first 2 days of muzzleloader season and first 3 days of firearms season."
  baiting: "Deer baiting is allowed Oct 21 - Nov 18 in WMUs A through L, with further restrictions, and is banned on some lands (refuges, many state lands without a permit)."
