# NH deer seasons, Sept 2026 - Aug 2027, for every Wildlife Management Unit (A through M). The
# Coos County units (A, B, C1, C2, D1 and E) were entered first; D2E, D2W, F, G1, G2, H1, H2, I1,
# I2, J1, J2, K, L and M were added on 2026-10-11 for the Concord-area (Merrimack County) region.
# On the official WMU map, WMU A is drawn as A1 and A2; deer rules for "A" cover both.
#
# Source: 2026-27 NH Hunting Digest (eRegulations edition, last updated 2026-08-27).
# The online season table had a garbled layout and was reconstructed; CONFIRM in the printed
# digest or with NH Fish and Game before relying on a date. The app shows this warning.
# The units added on 2026-10-11 were read from the eRegulations page by a summarizing tool and
# match the shape of other published tables (L and M: any deer all muzzleloader season, firearms
# any-deer Nov 11-22), but have not been checked against the printed digest either.

season_year: "2026-27"
verified_against_print: false
sources:
  seasons:
    title: "2026-27 NH Hunting Digest - Deer Hunting Seasons"
    url: https://www.eregulations.com/newhampshire/hunting/deer-hunting-seasons
    publisher: NH Fish and Game Department (eRegulations edition)
    source_date: "2026-08-27"
    retrieved: "2026-10-08"
  regulations:
    title: "2026-27 NH Hunting Digest - Deer Hunting Regulations"
    url: https://www.eregulations.com/newhampshire/hunting/deer-hunting-regulations
    publisher: NH Fish and Game Department (eRegulations edition)
    source_date: "2026-08-27"
    retrieved: "2026-10-08"
  digest_pdf:
    title: "2026-27 NH Hunting Digest (PDF) - crossbow rules, pp. 7-8 and 20"
    url: https://www.eregulations.com/assets/docs/guides/26NHHD_LR2.pdf
    publisher: NH Fish and Game Department (eRegulations edition)
    retrieved: "2026-10-09"
  crossbow_rule_2025:
    title: "New rules for hunters become effective September 1 (crossbows in archery season by WMU)"
    url: https://nhfishgame.com/2025/08/12/new-rules-for-hunters-become-effective-september-1/
    publisher: NH Fish and Game Department
    source_date: "2025-08-12"
    retrieved: "2026-10-09"
  wmu_boundaries:
    title: "2026-27 NH Hunting Digest - Wildlife Management Units"
    url: https://www.eregulations.com/newhampshire/hunting/wildlife-management-units
    publisher: NH Fish and Game Department (eRegulations edition)
    source_date: "2026-08-27"
    retrieved: "2026-10-08"

legal_hours:
  rule: "Half an hour before sunrise to half an hour after sunset."
  before_sunrise_min: 30
  after_sunset_min: 30
  source: regulations

# Each season: method, units it applies to, inclusive date range, which deer may be taken.
seasons:
  - method: archery
    units: [A]
    start: "2026-09-15"
    end: "2026-12-08"
    deer: any
    note: "WMU A archery closes one week earlier than the rest of the state."
  - method: archery
    units: [B, C1, C2, D1, D2E, D2W, E, F, G1, G2, H1, H2, I1, I2, J1, J2, K, L, M]
    start: "2026-09-15"
    end: "2026-12-15"
    deer: any
  - method: youth
    units: [A, B, C1, C2, D1, D2E, D2W, E, F, G1, G2, H1, H2, I1, I2, J1, J2, K, L, M]
    start: "2026-10-24"
    end: "2026-10-25"
    deer: any
    note: "Youth hunters only, with a licensed adult."
  - method: muzzleloader
    units: [A, B, C1, C2, D1]
    start: "2026-10-31"
    end: "2026-11-10"
    deer: antlered
  # Units where "any deer" runs for the first part of muzzleloader season, then antlered only
  # (any-deer end date, by unit): E and D2E Oct 31; F, G2, I2 Nov 1; I1 Nov 2; H1, H2, J1, J2, K
  # Nov 3; D2W Nov 4; G1 Nov 5.
  - method: muzzleloader
    units: [D2E, E]
    start: "2026-10-31"
    end: "2026-10-31"
    deer: any
  - method: muzzleloader
    units: [D2E, E]
    start: "2026-11-01"
    end: "2026-11-10"
    deer: antlered
  - method: muzzleloader
    units: [F, G2, I2]
    start: "2026-10-31"
    end: "2026-11-01"
    deer: any
  - method: muzzleloader
    units: [F, G2, I2]
    start: "2026-11-02"
    end: "2026-11-10"
    deer: antlered
  - method: muzzleloader
    units: [I1]
    start: "2026-10-31"
    end: "2026-11-02"
    deer: any
  - method: muzzleloader
    units: [I1]
    start: "2026-11-03"
    end: "2026-11-10"
    deer: antlered
  - method: muzzleloader
    units: [H1, H2, J1, J2, K]
    start: "2026-10-31"
    end: "2026-11-03"
    deer: any
  - method: muzzleloader
    units: [H1, H2, J1, J2, K]
    start: "2026-11-04"
    end: "2026-11-10"
    deer: antlered
  - method: muzzleloader
    units: [D2W]
    start: "2026-10-31"
    end: "2026-11-04"
    deer: any
  - method: muzzleloader
    units: [D2W]
    start: "2026-11-05"
    end: "2026-11-10"
    deer: antlered
  - method: muzzleloader
    units: [G1]
    start: "2026-10-31"
