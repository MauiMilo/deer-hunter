# NH deer seasons, Sept 2026 - Aug 2027, for the Wildlife Management Units that cover Coos County
# (A, B, C1, C2, D1 and E). On the official WMU map, WMU A is drawn as A1 and A2; deer rules for
# "A" cover both.
#
# Source: 2026-27 NH Hunting Digest (eRegulations edition, last updated 2026-08-27).
# The online season table had a garbled layout and was reconstructed; CONFIRM in the printed
# digest or with NH Fish and Game before relying on a date. The app shows this warning.

