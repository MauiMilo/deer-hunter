    end: "2026-11-10"
    deer: any
    note: "Units L and M allow any deer for the whole muzzleloader season."
  - method: firearm
    units: [A]
    start: "2026-11-11"
    end: "2026-11-11"
    deer: any
  - method: firearm
    units: [A]
    start: "2026-11-12"
    end: "2026-11-29"
    deer: antlered
  - method: firearm
    units: [B, C1, C2, D1]
    start: "2026-11-11"
    end: "2026-11-11"
    deer: any
  - method: firearm
    units: [B, C1, C2, D1]
    start: "2026-11-12"
    end: "2026-12-06"
    deer: antlered
  # Firearms: "any deer" opens Nov 11 everywhere and its last day depends on the unit
