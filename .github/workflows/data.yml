name: Refresh data

# Downloads real data from GRANIT, the Census Bureau and USGS, rebuilds the app's data files,
# and commits them. Runs on GitHub's servers because they have normal internet access.

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region to build
        default: coos
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC (5:17 AM in NH)
  push:
    branches: [main]
    paths:
      - "pipeline/deerscout/**"
      - "pipeline/data/**"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build-data:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Reuse downloaded elevation tiles
        uses: actions/cache@v4
        with:
          path: pipeline/.cache/*/dem
          key: dem-${{ github.run_id }}
          restore-keys: dem-
      - name: Build data
        shell: bash
        run: |
          set -o pipefail
          # Push the log so far to the run-logs branch every 2 minutes, so a run that dies
          # (for example out of memory) still leaves a trail.
          git config --global user.name "deer-scout-data-bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          (git fetch -q origin run-logs && git worktree add -q /tmp/logs origin/run-logs) || (git worktree add -q --detach /tmp/logs && cd /tmp/logs && git checkout -q --orphan run-logs-new && git rm -rfq . || true)
          (
            while sleep 120; do
              cp run.log /tmp/logs/latest.log 2>/dev/null || continue
              free -m > /tmp/logs/memory.txt 2>/dev/null || true
              (cd /tmp/logs && git add latest.log memory.txt && git commit -qm "Checkpoint ${{ github.run_id }}" && git push -qf origin HEAD:run-logs) || true
            done
          ) &
          python -m deerscout.build --region "${{ github.event.inputs.region || 'coos' }}" 2>&1 | tee run.log
      - name: Keep raw downloads for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-downloads
          path: pipeline/.cache/
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit updated data
        working-directory: .
        run: |
          git config user.name "deer-scout-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Save the run log to the run-logs branch
        if: always()
        working-directory: .
        shell: bash
        run: |
          cp pipeline/run.log /tmp/run.log 2>/dev/null || echo "no log" > /tmp/run.log
          git config user.name "deer-scout-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -f . && git clean -fdq
          git fetch origin run-logs || true
          if git rev-parse --verify origin/run-logs >/dev/null 2>&1; then git checkout -q -B run-logs origin/run-logs; else git checkout -q --orphan run-logs; git rm -rf -q . || true; fi
          cp /tmp/run.log latest.log
          git add latest.log
          git commit -q -m "Run ${{ github.run_id }} (${{ job.status }})" || true
          git push -q origin run-logs || true
